<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">Resultados experimentales Do We Need GNN Edge</title>
  <desc id="desc">Comparativa visual de MSE medio y número de configuraciones ganadas por modelo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#151922"/><stop offset="1" stop-color="#0b0d10"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#d7ff68"/><stop offset="1" stop-color="#8fb3ff"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1180" height="720" fill="url(#bg)"/>
  <circle cx="1000" cy="100" r="190" fill="#d7ff68" opacity="0.08"/>
  <circle cx="140" cy="650" r="220" fill="#8fb3ff" opacity="0.08"/>
  <text x="58" y="72" fill="#f5f7fa" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-1.2">Resultados experimentales</text>
  <text x="58" y="108" fill="#aeb7c2" font-family="Inter, Arial, sans-serif" font-size="16">MSE medio de test · menor es mejor · PINN seleccionado por mejor validación</text>
  <text x="58" y="152" fill="#d7ff68" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">ERROR MEDIO POR MODELO</text>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(58,190)">
      <line x1="0" y1="0" x2="540" y2="0" stroke="#ffffff" opacity="0.08"/>
      <line x1="0" y1="76" x2="540" y2="76" stroke="#ffffff" opacity="0.08"/>
      <line x1="0" y1="152" x2="540" y2="152" stroke="#ffffff" opacity="0.08"/>
      <line x1="0" y1="228" x2="540" y2="228" stroke="#ffffff" opacity="0.08"/>
      <line x1="0" y1="304" x2="540" y2="304" stroke="#ffffff" opacity="0.08"/>
      <g transform="translate(0,20)"><text x="0" y="20" fill="#f5f7fa" font-size="18" font-weight="750">Full-GNN</text><rect x="154" y="2" width="295" height="28" rx="14" fill="url(#accent)" filter="url(#glow)"/><text x="466" y="22" fill="#f5f7fa" font-size="16" font-weight="800">0.0146</text></g>
      <g transform="translate(0,96)"><text x="0" y="20" fill="#f5f7fa" font-size="18" font-weight="750">Tiny-GNN + PINN</text><rect x="154" y="2" width="471" height="28" rx="14" fill="#8fb3ff" opacity="0.86"/><text x="642" y="22" fill="#f5f7fa" font-size="16" font-weight="800">0.0233</text></g>
      <g transform="translate(0,172)"><text x="0" y="20" fill="#f5f7fa" font-size="18" font-weight="750">Tiny-GNN</text><rect x="154" y="2" width="473" height="28" rx="14" fill="#8fb3ff" opacity="0.62"/><text x="644" y="22" fill="#f5f7fa" font-size="16" font-weight="800">0.0234</text></g>
      <g transform="translate(0,248)"><text x="0" y="20" fill="#f5f7fa" font-size="18" font-weight="750">MLP</text><rect x="154" y="2" width="538" height="28" rx="14" fill="#ffffff" opacity="0.48"/><text x="708" y="22" fill="#f5f7fa" font-size="16" font-weight="800">0.0267</text></g>
    </g>
    <g transform="translate(720,152)">
      <text x="0" y="0" fill="#d7ff68" font-size="13" font-weight="700" letter-spacing="2">CONFIGURACIONES GANADAS</text>
      <text x="0" y="40" fill="#f5f7fa" font-size="54" font-weight="850" letter-spacing="-2">330</text>
      <text x="104" y="38" fill="#aeb7c2" font-size="15">comparaciones completas</text>
      <g transform="translate(0,76)">
        <circle cx="178" cy="178" r="132" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="38"/>
        <circle cx="178" cy="178" r="132" fill="none" stroke="#d7ff68" stroke-width="38" stroke-dasharray="345 484" transform="rotate(-90 178 178)"/>
        <circle cx="178" cy="178" r="132" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="38" stroke-dasharray="204 625" stroke-dashoffset="-345" transform="rotate(-90 178 178)"/>
        <circle cx="178" cy="178" r="132" fill="none" stroke="#8fb3ff" stroke-width="38" stroke-dasharray="154 675" stroke-dashoffset="-549" transform="rotate(-90 178 178)"/>
        <circle cx="178" cy="178" r="132" fill="none" stroke="#8fb3ff" stroke-opacity="0.42" stroke-width="38" stroke-dasharray="101 728" stroke-dashoffset="-703" transform="rotate(-90 178 178)"/>
        <text x="178" y="170" text-anchor="middle" fill="#f5f7fa" font-size="36" font-weight="850">144</text>
        <text x="178" y="198" text-anchor="middle" fill="#aeb7c2" font-size="13" letter-spacing="1.2">FULL-GNN WINS</text>
      </g>
      <g transform="translate(0,444)" font-size="14">
        <rect x="0" y="0" width="12" height="12" rx="6" fill="#d7ff68"/><text x="24" y="12" fill="#dce3ea">Full-GNN · 144</text>
        <rect x="180" y="0" width="12" height="12" rx="6" fill="#ffffff" opacity="0.55"/><text x="204" y="12" fill="#dce3ea">MLP · 85</text>
        <rect x="0" y="34" width="12" height="12" rx="6" fill="#8fb3ff"/><text x="24" y="46" fill="#dce3ea">Tiny-GNN + PINN · 61</text>
        <rect x="180" y="34" width="12" height="12" rx="6" fill="#8fb3ff" opacity="0.42"/><text x="204" y="46" fill="#dce3ea">Tiny-GNN · 40</text>
      </g>
    </g>
  </g>
  <text x="58" y="674" fill="#aeb7c2" font-family="Inter, Arial, sans-serif" font-size="14">Lectura rápida: Full-GNN lidera en MSE medio; MLP sigue siendo competitivo en casos limpios/simples; PINN mejora a Tiny-GNN especialmente con ruido.</text>
</svg>